name: apk
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Unzip project
        run: |
          mkdir proj
          for z in *.zip; do
            if unzip -Z1 "$z" | grep -x "build.gradle" > /dev/null; then unzip -q "$z" -d proj; break; fi
          done
          test -f proj/build.gradle
      - run: cd proj && gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: proj/app/build/outputs/apk/release/*.apk }
